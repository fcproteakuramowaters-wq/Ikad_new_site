name: Redeploy to Vercel

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  redeploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ikadhotel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Redeploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Deploy repository root to Vercel
          npx vercel --confirm --prod --token "$VERCEL_TOKEN"
